<div class="form-card">
  <h1>Book Appointment</h1>

  <form (ngSubmit)="bookAppointment()">

    <div class="form-group">
      <label>Select Date</label>

      <input type="date"
             name="selectedDate"
             [min]="minDate"
             [ngModel]="selectedDate()"
             (ngModelChange)="selectedDate.set($event); onDateOrSpecialisationChange()" />
    </div>

    <div class="form-group">
      <label>Specialisation</label>

      <select name="selectedSpecialisation"
              [ngModel]="selectedSpecialisation()"
              (ngModelChange)="selectedSpecialisation.set($event); onDateOrSpecialisationChange()">
        <option value="">-- Select Specialisation --</option>

        <option *ngFor="let item of specialisations"
                [value]="item">
          {{ item }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Select Doctor</label>

      <select name="selectedDoctorId"
              [ngModel]="selectedDoctorId()"
              (ngModelChange)="selectedDoctorId.set($event); onDoctorChange()">
        <option [ngValue]="null">-- Select Doctor --</option>

        <option *ngFor="let doctor of doctorService.availableDoctors()"
                [ngValue]="doctor.doctorId">
          {{ doctor.fullName }}
        </option>
      </select>

      <small *ngIf="showNoDoctorsMessage()">
        No doctors available with free time slots.
      </small>
    </div>

    <div class="form-group">
      <label>Time Slot</label>

      <select name="selectedTimeSlot"
              [ngModel]="selectedTimeSlot()"
              (ngModelChange)="selectedTimeSlot.set($event)">
        <option value="">-- Select Time Slot --</option>

        <option *ngFor="let slot of doctorService.availableSlots()"
                [value]="slot">
          {{ slot }}
        </option>
      </select>

      <small *ngIf="showNoSlotsMessage()">
        No free slots available for this doctor.
      </small>
    </div>

    <div class="success-message"
         *ngIf="successMessage()">
      {{ successMessage() }}
    </div>

    <div class="error-message"
         *ngIf="errorMessage()">
      {{ errorMessage() }}
    </div>

    <button type="submit"
            [disabled]="isBooking()">
      {{ isBooking() ? 'Booking...' : 'Book Appointment' }}
    </button>

  </form>
</div>
