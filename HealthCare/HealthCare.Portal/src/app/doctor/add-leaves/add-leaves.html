<div class="form-card">
  <h1>Add Leave</h1>

  <form (ngSubmit)="addLeave()">
    <div class="form-group">
      <label>Leave Date</label>
      <input type="date"
             name="leaveDate"
             [min]="minDate"
             [(ngModel)]="leaveDate">
    </div>

    <div class="form-group">
      <label>Reason</label>
      <textarea name="reason"
                [(ngModel)]="reason"
                rows="4">
      </textarea>
    </div>

    <button type="submit">Add Leave</button>
  </form>
</div>
