<div class="medical-history-page">

  <!-- SIDEBAR -->
  <app-patient-sidebar></app-patient-sidebar>

  <!-- MAIN CONTENT -->
  <div class="main">

    <!-- HEADING -->
    <div class="heading">
      <h2>
        <i class="bi bi-file-earmark-medical"></i> Medical History
      </h2>
      <p>View your previous health records</p>
    </div>

    <!-- TABLE CARD -->
    <div class="table-card">

      <table>

        <thead>
          <tr>
            <th><i class="bi bi-calendar"></i> Visit Date</th>
            <th><i class="bi bi-activity"></i> Diagnosis</th>
            <th><i class="bi bi-capsule"></i> Prescription</th>
            <th><i class="bi bi-journal-text"></i> Notes</th>
          </tr>
        </thead>

        <tbody>

          <!-- SHOW DATA -->
          <tr *ngFor="let r of records">
            <td>{{ r.visitDate | date:'dd-MM-yyyy' }}</td>
            <td>{{ r.diagnosis }}</td>
            <td>{{ r.prescription }}</td>
            <td>{{ r.notes || '-' }}</td>
          </tr>

          <!-- EMPTY MESSAGE -->
          <tr *ngIf="!loading && records.length === 0">
            <td colspan="4" class="empty">
              <i class="bi bi-info-circle"></i>
              No medical records found for this patient
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
