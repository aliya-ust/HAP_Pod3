<div class="page">
  <h2>My Appointments</h2>

  <div class="card" *ngIf="loading()">
    <p class="placeholder">Loading...</p>
  </div>

  <div class="card" *ngIf="!loading() && appointments().length === 0">
    <p class="placeholder">No appointments found</p>
  </div>

  <div *ngIf="!loading() && appointments().length > 0">
    <div *ngFor="let a of appointments()" class="appointment-card">
      <div class="appt-header">
        <span class="appt-date">{{ a.scheduledDate }}</span>
        <span class="appt-time">{{ a.timeSlot }}</span>
        <span class="badge" [ngClass]="statusClass(a.status)">{{ a.status }}</span>
      </div>
      <div class="appt-body">
        <div class="appt-field"><label>Doctor</label><span>{{ a.doctorName }}</span></div>
      </div>
    </div>
  </div>
</div>
