<div class="page">
  <h2>My Profile</h2>

  <div class="card" *ngIf="profile">
    <div class="profile-view">
      <div class="field"><label>Name</label><span>{{ profile.fullName }}</span></div>
      <div class="field"><label>Specialisation</label><span>{{ profile.specialisation }}</span></div>
      <div class="field"><label>Experience</label><span>{{ profile.yearsOfExperience }} years</span></div>
      <div class="field"><label>Consultation Fee</label><span>&#8377;{{ profile.consultationFee }}</span></div>
    </div>
  </div>

  <div class="card">
    <h3>Apply Leave</h3>
    <p class="hint">Select future dates you want to mark as leave.</p>

    <form [formGroup]="leaveForm" (ngSubmit)="submitLeaves()">
      <div formArrayName="leaveDates">
        <div *ngFor="let group of leaveDates.controls; let i = index" class="leave-row" [formGroupName]="i">
          <div class="form-group">
            <label [for]="'date-' + i">Date</label>
            <input [id]="'date-' + i" type="date" formControlName="date" [min]="today()" />
            <span class="field-error" *ngIf="group.get('date')?.invalid && group.get('date')?.touched">
              <span *ngIf="group.get('date')?.errors?.['required']">Date is required</span>
              <span *ngIf="group.get('date')?.errors?.['pastDate']">Must be today or future</span>
            </span>
          </div>
          <div class="form-group">
            <label [for]="'reason-' + i">Reason (optional)</label>
            <input [id]="'reason-' + i" type="text" formControlName="reason" maxlength="500" />
          </div>
          <button type="button" class="btn btn-danger btn-sm" (click)="removeLeaveDate(i)">Remove</button>
        </div>
      </div>

      <div class="leave-actions">
        <button type="button" class="btn btn-secondary" (click)="addLeaveDate()">+ Add Date</button>
        <button type="submit" class="btn btn-primary" [disabled]="leaveForm.invalid || submittingLeaves || leaveDates.length === 0">
          {{ submittingLeaves ? 'Submitting...' : 'Submit Leaves' }}
        </button>
      </div>
    </form>
  </div>
</div>
