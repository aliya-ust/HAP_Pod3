<div class="page">

  <div class="dashboard">

    <h1><i class="bi bi-speedometer2"></i> Dashboard</h1>

    <!-- PATIENT -->
    <div *ngIf="role() === 'Patient'">

      <div class="cards">

        <div class="card blue">
          <div class="icon"><i class="bi bi-calendar-check"></i></div>
          <div>
            <h3>Appointments</h3>
            <h2>{{ upcomingAppointments() }}</h2>
          </div>
        </div>

        <div class="card green">
          <div class="icon"><i class="bi bi-file-medical"></i></div>
          <div>
            <h3>Health Records</h3>
            <h2>{{ healthRecordCount() }}</h2>
          </div>
        </div>

      </div>

    </div>

    <!-- DOCTOR -->
    <div *ngIf="role() === 'Doctor'">

      <div class="cards">

        <div class="card blue">
          <div class="icon"><i class="bi bi-calendar-check"></i></div>
          <div>
            <h3>Appointments</h3>
            <h2>{{ upcomingAppointments() }}</h2>
          </div>
        </div>

        <div class="card green">
          <div class="icon"><i class="bi bi-check2-circle"></i></div>
          <div>
            <h3>Completed Appointments</h3>
            <h2>{{ completedAppointments() }}</h2>
          </div>
        </div>

        <div class="card purple">
          <div class="icon"><i class="bi bi-calendar-x"></i></div>
          <div>
            <h3>Leaves</h3>
            <h2>{{ upcomingLeaves() }}</h2>
          </div>
        </div>

      </div>

      <!-- Today's Appointments -->
      <div class="today-card">

        <h3><i class="bi bi-clock-history"></i> Today's Appointments</h3>

        <div class="slots">

          <div class="slot"
               *ngFor="let item of todayAppointments()">
            <i class="bi bi-clock"></i> {{ item.slot }}
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
