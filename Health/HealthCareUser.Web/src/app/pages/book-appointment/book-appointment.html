<div class="page">

  <div class="card">

    <h2><i class="bi bi-calendar-plus"></i> Book Appointment</h2>

    <!-- Date -->
    <div class="form-group">
      <label><i class="bi bi-calendar-date"></i> Select Date</label>
      <input type="date"
             [min]="minDate"
             [ngModel]="date()"
             (ngModelChange)="date.set($event); onDateOrSpecializationChange()" />
    </div>

    <!-- Specialization -->
    <div class="form-group">
      <label><i class="bi bi-hospital"></i> Specialization</label>
      <select [ngModel]="specialization()"
              (ngModelChange)="specialization.set($event); onDateOrSpecializationChange()">

        <option value="">-- Select --</option>

        <option *ngFor="let s of specializations" [value]="s">
          {{ s }}
        </option>

      </select>
    </div>

    <!-- Doctor -->
    <div class="form-group" *ngIf="doctors().length > 0">
      <label><i class="bi bi-person-badge"></i> Doctor</label>
      <select [ngModel]="selectedDoctorId()"
              (ngModelChange)="selectedDoctorId.set($event); onDoctorChange()">

        <option value="">-- Select Doctor --</option>

        <option *ngFor="let d of doctors()" [value]="d.doctorId">
          {{ d.fullName }}
        </option>

      </select>
    </div>

    <!-- Time Slots -->
    <div class="form-group" *ngIf="timeSlots().length > 0">
      <label><i class="bi bi-clock"></i> Time Slot</label>
      <select [ngModel]="selectedSlot()"
              (ngModelChange)="selectedSlot.set($event)">

        <option value="">-- Select Slot --</option>

        <option *ngFor="let t of timeSlots()" [value]="t">
          {{ t }}
        </option>

      </select>
    </div>

    <!-- Button -->
    <button class="primary-btn" (click)="bookAppointment()">
      <i class="bi bi-check-circle"></i> Book Appointment
    </button>

    <!-- Message -->
    <p class="message">{{ message() }}</p>

  </div>

</div>
