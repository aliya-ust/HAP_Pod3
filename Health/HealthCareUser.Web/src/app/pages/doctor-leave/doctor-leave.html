<div class="page">

  <div class="card">

    <h2><i class="bi bi-calendar-x"></i> Add Leave</h2>

    <!-- Date Section -->
    <div class="form-group">
      <label for="leaveDate"><i class="bi bi-calendar-date"></i> Select Leave Date</label>

      <div class="date-row">
        <input
               id="leaveDate"
               type="date"
               [ngModel]="selectedDate()"
               (ngModelChange)="selectedDate.set($event)">

        <button class="add-btn" (click)="addLeaveDate()">
          <i class="bi bi-plus-circle"></i> Add
        </button>
      </div>
    </div>

    <!-- Leave List -->
    <div class="leave-list" *ngIf="leaveDates().length > 0">

      <h3><i class="bi bi-list-check"></i> Selected Leaves</h3>

      <div class="leave-item"
           *ngFor="let date of leaveDates(); let i = index">

        <span><i class="bi bi-calendar-event"></i> {{ date }}</span>

        <button class="remove-btn"
                (click)="removeLeaveDate(i)">
          <i class="bi bi-trash"></i>
        </button>

      </div>
    </div>

    <!-- Reason -->
    <div class="form-group">
      <label for="reason"><i class="bi bi-chat-left-text"></i> Reason</label>

      <textarea
                id="reason"
                rows="4"
                [ngModel]="reason()"
                (ngModelChange)="reason.set($event)"
                placeholder="Optional reason for leave...">
      </textarea>
    </div>

    <!-- Submit -->
    <button class="submit-btn"
            (click)="submitLeaves()">
      <i class="bi bi-check-circle"></i> Submit Leaves
    </button>

    <!-- Messages -->
    <p class="success" *ngIf="successMessage()">
      <i class="bi bi-check-circle-fill"></i> {{ successMessage() }}
    </p>

    <p class="error" *ngIf="errorMessage()">
      <i class="bi bi-exclamation-circle-fill"></i> {{ errorMessage() }}
    </p>

  </div>

</div>
